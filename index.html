<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Video Clipper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #videoPreview {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            background: black;
        }

        .controls {
            margin-top: 20px;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px;
            margin: 5px;
        }

        button,
        a {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        #clipButton {
            background: #222;
            color: white;
        }

        #downloadButton {
            background: green;
            color: white;
            display: none;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Free Video Clipper</h1>

    <p>Upload your long video to start.</p>

    <input type="file" id="videoInput" accept="video/*">

    <video
        id="videoPreview"
        controls
        style="display:none;">
    </video>

    <div class="controls">

        <div>
            <label for="startTime">Start Time:</label>

            <input
                type="number"
                id="startTime"
                value="0"
                min="0"
                step="0.1">

            seconds
        </div>

        <div>
            <label for="endTime">End Time:</label>

            <input
                type="number"
                id="endTime"
                value="0"
                min="0"
                step="0.1">

            seconds
        </div>

        <div id="durationText"></div>

        <button id="clipButton">
            Create Clip
        </button>

        <br>

        <a
            id="downloadButton"
            href="#"
            download="clipped-video.webm">

            Download Clip

        </a>

        <div id="status"></div>

    </div>

    <script>

        const videoInput =
            document.getElementById("videoInput");

        const videoPreview =
            document.getElementById("videoPreview");

        const startTime =
            document.getElementById("startTime");

        const endTime =
            document.getElementById("endTime");

        const durationText =
            document.getElementById("durationText");

        const clipButton =
            document.getElementById("clipButton");

        const downloadButton =
            document.getElementById("downloadButton");

        const status =
            document.getElementById("status");

        let selectedFile = null;

        let mediaRecorder = null;

        let recordedChunks = [];

        videoInput.addEventListener(
            "change",
            function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                selectedFile = file;

                const videoURL =
                    URL.createObjectURL(file);

                videoPreview.src =
                    videoURL;

                videoPreview.style.display =
                    "block";

                videoPreview.load();

                downloadButton.style.display =
                    "none";

                status.textContent = "";

            }
        );

        videoPreview.addEventListener(
            "loadedmetadata",
            function () {

                const duration =
                    videoPreview.duration;

                durationText.textContent =
                    "Video Duration: " +
                    duration.toFixed(1) +
                    " seconds";

                endTime.value =
                    duration.toFixed(1);

                startTime.max =
                    duration;

                endTime.max =
                    duration;

            }
        );

        clipButton.addEventListener(
            "click",
            async function () {

                if (!selectedFile) {

                    status.textContent =
                        "Error: Please upload a video first.";

                    return;
                }

                const start =
                    parseFloat(startTime.value);

                const end =
                    parseFloat(endTime.value);

                if (
                    isNaN(start) ||
                    isNaN(end)
                ) {

                    status.textContent =
                        "Error: Enter valid start and end times.";

                    return;
                }

                if (
                    start < 0 ||
                    end <= start
                ) {

                    status.textContent =
                        "Error: End time must be greater than start time.";

                    return;
                }

                if (
                    end >
                    videoPreview.duration
                ) {

                    status.textContent =
                        "Error: End time cannot exceed video duration.";

                    return;
                }

                try {

                    clipButton.disabled =
                        true;

                    downloadButton.style.display =
                        "none";

                    recordedChunks = [];

                    status.textContent =
                        "Preparing video clip...";

                    const stream =
                        videoPreview.captureStream();

                    const mimeTypes = [
                        "video/webm;codecs=vp9",
                        "video/webm;codecs=vp8",
                        "video/webm"
                    ];

                    let supportedType = "";

                    for (
                        const type
                        of mimeTypes
                    ) {

                        if (
                            MediaRecorder.isTypeSupported(type)
                        ) {

                            supportedType =
                                type;

                            break;
                        }
                    }

                    if (!supportedType) {

                        throw new Error(
                            "This browser does not support video recording."
                        );
                    }

                    mediaRecorder =
                        new MediaRecorder(
                            stream,
                            {
                                mimeType:
                                    supportedType
                            }
                        );

                    mediaRecorder.ondataavailable =
                        function (event) {

                            if (
                                event.data &&
                                event.data.size > 0
                            ) {

                                recordedChunks.push(
                                    event.data
                                );
                            }
                        };

                    const recordingFinished =
                        new Promise(
                            function (resolve) {

                                mediaRecorder.onstop =
                                    resolve;

                            }
                        );

                    videoPreview.currentTime =
                        start;

                    await new Promise(
                        function (resolve) {

                            videoPreview.onseeked =
                                function () {

                                    resolve();

                                };

                        }
                    );

                    mediaRecorder.start();

                    status.textContent =
                        "Creating video clip...";

                    videoPreview.play();

                    const clipDuration =
                        (end - start) * 1000;

                    await new Promise(
                        function (resolve) {

                            setTimeout(
                                resolve,
                                clipDuration
                            );

                        }
                    );

                    videoPreview.pause();

                    mediaRecorder.stop();

                    await recordingFinished;

                    const blob =
                        new Blob(
                            recordedChunks,
                            {
                                type:
                                    supportedType
                            }
                        );

                    const url =
                        URL.createObjectURL(blob);

                    downloadButton.href =
                        url;

                    downloadButton.download =
                        "clipped-video.webm";

                    downloadButton.style.display =
                        "inline-block";

                    status.textContent =
                        "Clip created successfully.";

                }
                catch (error) {

                    console.error(error);

                    status.textContent =
                        "Error: " +
                        (
                            error.message ||
                            error
                        );

                }
                finally {

                    clipButton.disabled =
                        false;

                }

            }
        );

    </script>

</body>
</html>
