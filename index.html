<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Video Clipper</title>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.11.0/dist/util.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #videoPreview {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            background: black;
        }

        .controls {
            margin-top: 20px;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        #clipButton {
            background: #222;
            color: white;
        }

        #downloadButton {
            background: green;
            color: white;
            display: none;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Free Video Clipper</h1>

    <p>Upload your long video to start.</p>

    <input type="file" id="videoInput" accept="video/*">

    <video id="videoPreview" controls style="display:none;"></video>

    <div class="controls">

        <div>
            <label>Start Time:</label>
            <input type="number" id="startTime" value="0" min="0" step="0.1">
            seconds
        </div>

        <div>
            <label>End Time:</label>
            <input type="number" id="endTime" value="0" min="0" step="0.1">
            seconds
        </div>

        <div id="durationText"></div>

        <button id="clipButton">✂️ Create Clip</button>

        <br>

        <a id="downloadButton" download="clipped-video.mp4">
            Download Clip
        </a>

        <div id="status"></div>

    </div>

    <script>

        const { createFFmpeg, fetchFile } = FFmpeg;

        const ffmpeg = createFFmpeg({
            log: true
        });

        const videoInput = document.getElementById("videoInput");
        const videoPreview = document.getElementById("videoPreview");

        const startTime = document.getElementById("startTime");
        const endTime = document.getElementById("endTime");

        const durationText = document.getElementById("durationText");
        const clipButton = document.getElementById("clipButton");

        const downloadButton =
            document.getElementById("downloadButton");

        const status =
            document.getElementById("status");

        let selectedFile = null;

        videoInput.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) {
                return;
            }

            selectedFile = file;

            const videoURL = URL.createObjectURL(file);

            videoPreview.src = videoURL;
            videoPreview.style.display = "block";

            videoPreview.load();

            downloadButton.style.display = "none";
            status.textContent = "";
        });

        videoPreview.addEventListener("loadedmetadata", function () {

            const duration = videoPreview.duration;

            durationText.textContent =
                "Video Duration: " +
                duration.toFixed(1) +
                " seconds";

            endTime.value = duration.toFixed(1);

            endTime.max = duration;
            startTime.max = duration;
        });

        clipButton.addEventListener("click", async function () {

            if (!selectedFile) {
                alert("Pehle video upload karo.");
                return;
            }

            const start = parseFloat(startTime.value);
            const end = parseFloat(endTime.value);

            if (isNaN(start) || isNaN(end)) {
                alert("Start aur End time enter karo.");
                return;
            }

            if (start < 0 || end <= start) {
                alert("End Time, Start Time se zyada honi chahiye.");
                return;
            }

            if (end > videoPreview.duration) {
                alert("End Time video ki duration se zyada hai.");
                return;
            }

            try {

                clipButton.disabled = true;

                status.textContent =
                    "Video engine load ho raha hai...";

                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                status.textContent =
                    "Video clip ban rahi hai...";

                ffmpeg.FS(
                    "writeFile",
                    "input.mp4",
                    await fetchFile(selectedFile)
                );

                const duration = end - start;

                await ffmpeg.run(
                    "-ss",
                    String(start),
                    "-i",
                    "input.mp4",
                    "-t",
                    String(duration),
                    "-c",
                    "copy",
                    "output.mp4"
                );

                const data =
                    ffmpeg.FS(
                        "readFile",
                        "output.mp4"
                    );

                const blob =
                    new Blob(
                        [data.buffer],
                        { type: "video/mp4" }
                    );

                const url =
                    URL.createObjectURL(blob);

                downloadButton.href = url;
                downloadButton.style.display = "inline-block";

                status.textContent =
                    "✅ Clip ready hai! Download Clip par click karo.";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Clip banane mein error aya. Console/error screenshot bhejo.";

            } finally {

                clipButton.disabled = false;

            }

        });

    </script>

</body>
</html>
