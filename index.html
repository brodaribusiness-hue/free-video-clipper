<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Video Clipper</title>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        #videoPreview {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            background: black;
        }

        .controls {
            margin-top: 20px;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px;
            margin: 5px;
        }

        button,
        a {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        #clipButton {
            background: #222;
            color: white;
        }

        #clipButton:disabled {
            opacity: 0.6;
        }

        #downloadButton {
            background: green;
            color: white;
            display: none;
        }

        #progressContainer {
            width: 100%;
            max-width: 500px;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            margin: 20px auto 10px;
            overflow: hidden;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #2196f3;
            transition: width 0.15s linear;
        }

        #progressText {
            display: none;
            font-weight: bold;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Free Video Clipper</h1>

    <p>Upload your long video to start.</p>

    <input
        type="file"
        id="videoInput"
        accept="video/*"
    >

    <video
        id="videoPreview"
        controls
        style="display:none;">
    </video>

    <div class="controls">

        <div>
            <label for="startTime">
                Start Time:
            </label>

            <input
                type="number"
                id="startTime"
                value="0"
                min="0"
                step="0.1"
            >

            seconds
        </div>

        <div>
            <label for="endTime">
                End Time:
            </label>

            <input
                type="number"
                id="endTime"
                value="0"
                min="0"
                step="0.1"
            >

            seconds
        </div>

        <div id="durationText"></div>

        <button id="clipButton">
            Create MP4 Clip
        </button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="progressText">
            0%
        </div>

        <div id="status"></div>

        <br>

        <a
            id="downloadButton"
            href="#"
            download="clipped-video.mp4">
            Download Clip
        </a>

    </div>

    <script>

        const {
            createFFmpeg,
            fetchFile
        } = FFmpeg;

        const ffmpeg =
            createFFmpeg({
                log: true,

                mainName: "main",

                corePath:
                    "https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js"
            });

        const videoInput =
            document.getElementById(
                "videoInput"
            );

        const videoPreview =
            document.getElementById(
                "videoPreview"
            );

        const startTime =
            document.getElementById(
                "startTime"
            );

        const endTime =
            document.getElementById(
                "endTime"
            );

        const durationText =
            document.getElementById(
                "durationText"
            );

        const clipButton =
            document.getElementById(
                "clipButton"
            );

        const downloadButton =
            document.getElementById(
                "downloadButton"
            );

        const progressContainer =
            document.getElementById(
                "progressContainer"
            );

        const progressBar =
            document.getElementById(
                "progressBar"
            );

        const progressText =
            document.getElementById(
                "progressText"
            );

        const status =
            document.getElementById(
                "status"
            );

        let selectedFile = null;

        let downloadUrl = null;

        let ffmpegLoaded = false;

        videoInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];

                if (!file) {
                    return;
                }

                selectedFile =
                    file;

                videoPreview.src =
                    URL.createObjectURL(
                        file
                    );

                videoPreview.style.display =
                    "block";

                videoPreview.load();

                downloadButton.style.display =
                    "none";

                status.textContent =
                    "";

                resetProgress();
            }
        );

        videoPreview.addEventListener(
            "loadedmetadata",
            function () {

                const duration =
                    videoPreview.duration;

                durationText.textContent =
                    "Video Duration: " +
                    duration.toFixed(1) +
                    " seconds";

                endTime.value =
                    duration.toFixed(1);

                startTime.max =
                    duration;

                endTime.max =
                    duration;
            }
        );

        function resetProgress() {

            progressBar.style.width =
                "0%";

            progressText.textContent =
                "0%";

            progressContainer.style.display =
                "none";

            progressText.style.display =
                "none";
        }

        function updateProgress(
            value
        ) {

            const percent =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            value
                        )
                    )
                );

            progressBar.style.width =
                percent + "%";

            progressText.textContent =
                percent + "%";

            progressContainer.style.display =
                "block";

            progressText.style.display =
                "block";
        }

        ffmpeg.setProgress(
            function ({
                ratio
            }) {

                updateProgress(
                    ratio * 100
                );
            }
        );

        clipButton.addEventListener(
            "click",
            async function () {

                if (!selectedFile) {

                    status.textContent =
                        "Error: Please upload a video first.";

                    return;
                }

                const start =
                    parseFloat(
                        startTime.value
                    );

                const end =
                    parseFloat(
                        endTime.value
                    );

                if (
                    isNaN(start) ||
                    isNaN(end)
                ) {

                    status.textContent =
                        "Error: Enter valid start and end times.";

                    return;
                }

                if (
                    start < 0 ||
                    end <= start
                ) {

                    status.textContent =
                        "Error: End time must be greater than start time.";

                    return;
                }

                if (
                    end >
                    videoPreview.duration
                ) {

                    status.textContent =
                        "Error: End time cannot exceed video duration.";

                    return;
                }

                try {

                    clipButton.disabled =
                        true;

                    downloadButton.style.display =
                        "none";

                    resetProgress();

                    status.textContent =
                        "Loading video engine...";

                    if (!ffmpegLoaded) {

                        await ffmpeg.load();

                        ffmpegLoaded =
                            true;
                    }

                    status.textContent =
                        "Preparing video...";

                    updateProgress(0);

                    try {

                        ffmpeg.FS(
                            "unlink",
                            "input.mp4"
                        );

                    } catch (error) {}

                    try {

                        ffmpeg.FS(
                            "unlink",
                            "output.mp4"
                        );

                    } catch (error) {}

                    ffmpeg.FS(
                        "writeFile",
                        "input.mp4",
                        await fetchFile(
                            selectedFile
                        )
                    );

                    const duration =
                        end - start;

                    status.textContent =
                        "Creating MP4 clip...";

                    await ffmpeg.run(
                        "-ss",
                        String(start),

                        "-i",
                        "input.mp4",

                        "-t",
                        String(duration),

                        "-map",
                        "0:v:0",

                        "-map",
                        "0:a?",

                        "-c:v",
                        "libx264",

                        "-preset",
                        "ultrafast",

                        "-c:a",
                        "aac",

                        "-movflags",
                        "+faststart",

                        "output.mp4"
                    );

                    updateProgress(
                        100
                    );

                    const data =
                        ffmpeg.FS(
                            "readFile",
                            "output.mp4"
                        );

                    const blob =
                        new Blob(
                            [data.buffer],
                            {
                                type:
                                    "video/mp4"
                            }
                        );

                    if (downloadUrl) {

                        URL.revokeObjectURL(
                            downloadUrl
                        );
                    }

                    downloadUrl =
                        URL.createObjectURL(
                            blob
                        );

                    downloadButton.href =
                        downloadUrl;

                    downloadButton.download =
                        "clipped-video-" +
                        Date.now() +
                        ".mp4";

                    downloadButton.style.display =
                        "inline-block";

                    status.textContent =
                        "Clip created successfully.";

                }
                catch (error) {

                    console.error(
                        error
                    );

                    status.textContent =
                        "Error: " +
                        (
                            error.message ||
                            error
                        );

                }
                finally {

                    clipButton.disabled =
                        false;
                }
            }
        );

    </script>

</body>
</html>
