<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Video Clipper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        #videoPreview {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            background: black;
        }

        .controls {
            margin-top: 20px;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px;
            margin: 5px;
        }

        button,
        a {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        #clipButton {
            background: #222;
            color: white;
        }

        #clipButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #downloadButton {
            background: green;
            color: white;
            display: none;
        }

        #progressContainer {
            width: 100%;
            max-width: 500px;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            margin: 20px auto 10px;
            overflow: hidden;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #2196f3;
            transition: width 0.1s linear;
        }

        #progressText {
            font-weight: bold;
            display: none;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Free Video Clipper</h1>

    <p>Upload your long video to start.</p>

    <input
        type="file"
        id="videoInput"
        accept="video/*"
    >

    <video
        id="videoPreview"
        controls
        style="display:none;">
    </video>

    <div class="controls">

        <div>
            <label for="startTime">
                Start Time:
            </label>

            <input
                type="number"
                id="startTime"
                value="0"
                min="0"
                step="0.1"
            >

            seconds
        </div>

        <div>
            <label for="endTime">
                End Time:
            </label>

            <input
                type="number"
                id="endTime"
                value="0"
                min="0"
                step="0.1"
            >

            seconds
        </div>

        <div id="durationText"></div>

        <button id="clipButton">
            Create Clip
        </button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="progressText">
            0%
        </div>

        <div id="status"></div>

        <br>

        <a
            id="downloadButton"
            href="#"
            download="clipped-video.webm"
        >
            Download Clip
        </a>

    </div>

    <script>

        const videoInput =
            document.getElementById("videoInput");

        const videoPreview =
            document.getElementById("videoPreview");

        const startTime =
            document.getElementById("startTime");

        const endTime =
            document.getElementById("endTime");

        const durationText =
            document.getElementById("durationText");

        const clipButton =
            document.getElementById("clipButton");

        const downloadButton =
            document.getElementById("downloadButton");

        const progressContainer =
            document.getElementById("progressContainer");

        const progressBar =
            document.getElementById("progressBar");

        const progressText =
            document.getElementById("progressText");

        const status =
            document.getElementById("status");

        let selectedFile = null;

        let mediaRecorder = null;

        let recordedChunks = [];

        let currentVideoURL = null;

        let currentDownloadURL = null;

        videoInput.addEventListener(
            "change",
            function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                selectedFile = file;

                if (currentVideoURL) {
                    URL.revokeObjectURL(
                        currentVideoURL
                    );
                }

                currentVideoURL =
                    URL.createObjectURL(file);

                videoPreview.src =
                    currentVideoURL;

                videoPreview.style.display =
                    "block";

                videoPreview.load();

                downloadButton.style.display =
                    "none";

                status.textContent = "";

                resetProgress();

            }
        );

        videoPreview.addEventListener(
            "loadedmetadata",
            function () {

                const duration =
                    videoPreview.duration;

                durationText.textContent =
                    "Video Duration: " +
                    duration.toFixed(1) +
                    " seconds";

                endTime.value =
                    duration.toFixed(1);

                startTime.max =
                    duration;

                endTime.max =
                    duration;

            }
        );

        function resetProgress() {

            progressBar.style.width =
                "0%";

            progressText.textContent =
                "0%";

            progressContainer.style.display =
                "none";

            progressText.style.display =
                "none";
        }

        function updateProgress(value) {

            const percent =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(value)
                    )
                );

            progressBar.style.width =
                percent + "%";

            progressText.textContent =
                percent + "%";

            progressContainer.style.display =
                "block";

            progressText.style.display =
                "block";
        }

        clipButton.addEventListener(
            "click",
            async function () {

                if (!selectedFile) {

                    status.textContent =
                        "Error: Please upload a video first.";

                    return;
                }

                const start =
                    parseFloat(
                        startTime.value
                    );

                const end =
                    parseFloat(
                        endTime.value
                    );

                if (
                    isNaN(start) ||
                    isNaN(end)
                ) {

                    status.textContent =
                        "Error: Enter valid start and end times.";

                    return;
                }

                if (
                    start < 0 ||
                    end <= start
                ) {

                    status.textContent =
                        "Error: End time must be greater than start time.";

                    return;
                }

                if (
                    end >
                    videoPreview.duration
                ) {

                    status.textContent =
                        "Error: End time cannot exceed video duration.";

                    return;
                }

                try {

                    clipButton.disabled =
                        true;

                    downloadButton.style.display =
                        "none";

                    status.textContent =
                        "Preparing clip...";

                    updateProgress(0);

                    recordedChunks = [];

                    if (currentDownloadURL) {

                        URL.revokeObjectURL(
                            currentDownloadURL
                        );

                        currentDownloadURL =
                            null;
                    }

                    const stream =
                        videoPreview.captureStream();

                    const mimeTypes = [
                        "video/webm;codecs=vp9",
                        "video/webm;codecs=vp8",
                        "video/webm"
                    ];

                    let supportedType = "";

                    for (
                        const type
                        of mimeTypes
                    ) {

                        if (
                            MediaRecorder
                                .isTypeSupported(type)
                        ) {

                            supportedType =
                                type;

                            break;
                        }
                    }

                    if (!supportedType) {

                        throw new Error(
                            "This browser does not support video recording."
                        );
                    }

                    mediaRecorder =
                        new MediaRecorder(
                            stream,
                            {
                                mimeType:
                                    supportedType
                            }
                        );

                    mediaRecorder.ondataavailable =
                        function (event) {

                            if (
                                event.data &&
                                event.data.size > 0
                            ) {

                                recordedChunks.push(
                                    event.data
                                );
                            }
                        };

                    const recordingFinished =
                        new Promise(
                            function (resolve) {

                                mediaRecorder.onstop =
                                    resolve;

                            }
                        );

                    status.textContent =
                        "Seeking to start position...";

                    await new Promise(
                        function (resolve, reject) {

                            const seekHandler =
                                function () {

                                    videoPreview
                                        .removeEventListener(
                                            "seeked",
                                            seekHandler
                                        );

                                    resolve();
                                };

                            videoPreview
                                .addEventListener(
                                    "seeked",
                                    seekHandler
                                );

                            videoPreview.currentTime =
                                start;

                            setTimeout(
                                function () {

                                    videoPreview
                                        .removeEventListener(
                                            "seeked",
                                            seekHandler
                                        );

                                    if (
                                        Math.abs(
                                            videoPreview.currentTime -
                                            start
                                        ) < 1
                                    ) {

                                        resolve();

                                    } else {

                                        reject(
                                            new Error(
                                                "Unable to seek to the selected start time."
                                            )
                                        );

                                    }

                                },
                                5000
                            );

                        }
                    );

                    const clipDuration =
                        end - start;

                    mediaRecorder.start(
                        100
                    );

                    status.textContent =
                        "Creating clip...";

                    await videoPreview.play();

                    const startTimestamp =
                        performance.now();

                    await new Promise(
                        function (resolve) {

                            const progressTimer =
                                setInterval(
                                    function () {

                                        const elapsed =
                                            performance.now() -
                                            startTimestamp;

                                        const percent =
                                            (
                                                elapsed /
                                                (clipDuration * 1000)
                                            ) * 100;

                                        updateProgress(
                                            percent
                                        );

                                        if (
                                            elapsed >=
                                            clipDuration * 1000
                                        ) {

                                            clearInterval(
                                                progressTimer
                                            );

                                            resolve();
                                        }

                                    },
                                    100
                                );

                        }
                    );

                    videoPreview.pause();

                    updateProgress(100);

                    mediaRecorder.stop();

                    await recordingFinished;

                    if (
                        recordedChunks.length === 0
                    ) {

                        throw new Error(
                            "No video data was recorded."
                        );
                    }

                    const blob =
                        new Blob(
                            recordedChunks,
                            {
                                type:
                                    supportedType
                            }
                        );

                    currentDownloadURL =
                        URL.createObjectURL(
                            blob
                        );

                    downloadButton.href =
                        currentDownloadURL;

                    downloadButton.download =
                        "clipped-video-" +
                        Date.now() +
                        ".webm";

                    downloadButton.style.display =
                        "inline-block";

                    status.textContent =
                        "Clip created successfully.";

                }
                catch (error) {

                    console.error(error);

                    status.textContent =
                        "Error: " +
                        (
                            error.message ||
                            error
                        );

                }
                finally {

                    clipButton.disabled =
                        false;

                }

            }
        );

    </script>

</body>
</html>
